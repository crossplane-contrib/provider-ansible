# A ClusterProviderConfig is cluster-scoped and can be referenced by an
# AnsibleRun in any namespace. Because it is cluster-scoped, its secretRef
# must name a namespace explicitly (namespace is a required field) - there
# is no "own namespace" to default to.
#
# Its credentials are cluster-wide: the secretRef below names
# "crossplane-system", the conventional home for provider credentials, and
# this one ClusterProviderConfig serves namespaced AnsibleRuns in every
# namespace - including examples/namespaced/ansibleRun-playbook-inline.yml,
# which lives in "team-a". You do not need to copy the Secret into each
# namespace. See "ClusterProviderConfig credentials are cluster-wide" in the
# README.
#
# That relaxation covers only the credentials this cluster-scoped config
# declares. It does not widen what a namespaced AnsibleRun may declare for
# itself: spec.forProvider.inventories on an AnsibleRun in "team-a" may still
# only name Secrets in "team-a", whichever provider config it references. If
# you would rather each namespace kept its own credential, use a namespaced
# ProviderConfig instead (see providerconfig.yaml).
#
# The Secret below is the same material as the one in providerconfig.yaml,
# but in a different namespace, so the two files can be applied together as
# well as on their own.
apiVersion: v1
kind: Secret
metadata:
  namespace: crossplane-system
  name: gcp-credentials
type: Opaque
data:
  credentials: QkFTRTY0RU5DT0RFRF9QUk9WSURFUl9DUkVEUw==
---
apiVersion: ansible.m.crossplane.io/v1alpha1
kind: ClusterProviderConfig
metadata:
  name: default
spec:
  credentials:
    - filename: gcp-credentials.json
      source: Secret
      secretRef:
        namespace: crossplane-system
        name: gcp-credentials
        key: credentials

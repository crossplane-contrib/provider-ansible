# A namespaced ProviderConfig is only usable by AnsibleRuns in its own
# namespace, and may only reference Secrets in that namespace.
apiVersion: v1
kind: Secret
metadata:
  namespace: team-a
  name: gcp-credentials
type: Opaque
data:
  credentials: QkFTRTY0RU5DT0RFRF9QUk9WSURFUl9DUkVEUw==
---
apiVersion: ansible.m.crossplane.io/v1alpha1
kind: ProviderConfig
metadata:
  namespace: team-a
  name: default
spec:
  credentials:
    - filename: gcp-credentials.json
      source: Secret
      secretRef:
        name: gcp-credentials
        key: credentials
  requirements: |
    ---
    collections:
      - name: google.cloud
        source: https://galaxy.ansible.com
        version: "1.0.2"
